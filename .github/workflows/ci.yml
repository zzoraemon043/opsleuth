name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install . pytest ruff
      - run: ruff check .
      - run: python -m pytest -q

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Fixtures match their sources
        working-directory: tests/data
        run: |
          for f in src/*.lua; do
            name=$(basename "$f" .lua)
            luac5.1 -o "/tmp/$name.luac" "$f"
            cmp "/tmp/$name.luac" "luac51/$name.luac"
          done
